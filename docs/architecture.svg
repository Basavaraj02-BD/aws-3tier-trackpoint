<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect width="960" height="740" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#232f3e">TrackPoint (TPMS) - AWS 3-Tier Architecture</text>

  <!-- Users and GitHub (outside AWS) -->
  <rect x="400" y="46" width="160" height="42" rx="8" fill="#eceff1" stroke="#232f3e" stroke-width="1.5"/>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#232f3e">Users / Browser</text>

  <rect x="780" y="46" width="140" height="42" rx="8" fill="#eceff1" stroke="#232f3e" stroke-width="1.5"/>
  <text x="850" y="72" text-anchor="middle" font-size="14" fill="#232f3e">GitHub repo</text>

  <!-- Region and VPC -->
  <rect x="20" y="105" width="920" height="580" rx="10" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="34" y="124" font-size="13" font-weight="bold" fill="#232f3e">AWS Region: ap-south-1 (Mumbai)</text>

  <rect x="40" y="134" width="880" height="535" rx="10" fill="#fafcff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="54" y="153" font-size="13" font-weight="bold" fill="#3b6fd4">VPC: trackpoint (10.0.0.0/16) - 2 Availability Zones</text>

  <!-- Internet Gateway -->
  <rect x="400" y="162" width="160" height="32" rx="6" fill="#ffffff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="480" y="183" text-anchor="middle" font-size="13" fill="#232f3e">Internet Gateway</text>

  <!-- Users -> IGW -->
  <line x1="480" y1="88" x2="480" y2="160" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="130" font-size="12" fill="#232f3e">HTTP :80</text>

  <!-- Tier 1 -->
  <rect x="60" y="210" width="840" height="125" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="74" y="229" font-size="13" font-weight="bold" fill="#2e7d32">TIER 1 - Presentation: public subnets (AZ-a and AZ-b)</text>

  <rect x="300" y="244" width="240" height="74" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="420" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#232f3e">Application Load Balancer</text>
  <text x="420" y="285" text-anchor="middle" font-size="12" fill="#232f3e">internet-facing, listener HTTP :80</text>
  <text x="420" y="303" text-anchor="middle" font-size="12" fill="#232f3e">Security group: ALB-SG</text>

  <rect x="640" y="244" width="200" height="74" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#232f3e">NAT Gateway</text>
  <text x="740" y="285" text-anchor="middle" font-size="12" fill="#232f3e">with Elastic IP</text>
  <text x="740" y="303" text-anchor="middle" font-size="12" fill="#232f3e">public subnet, AZ-a</text>

  <!-- IGW -> ALB -->
  <line x1="480" y1="194" x2="480" y2="243" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GitHub -> NAT (outbound, dashed) -->
  <line x1="850" y1="88" x2="800" y2="243" stroke="#8a8f98" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrowDash)"/>
  <text x="838" y="170" font-size="11" fill="#6b7280">git clone / pull</text>

  <!-- Tier 2 -->
  <rect x="60" y="365" width="840" height="125" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="74" y="384" font-size="13" font-weight="bold" fill="#1565c0">TIER 2 - Application: private subnet (AZ-a)</text>

  <rect x="300" y="399" width="240" height="78" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="420" y="421" text-anchor="middle" font-size="14" font-weight="bold" fill="#232f3e">EC2: trackpoint-app</text>
  <text x="420" y="440" text-anchor="middle" font-size="12" fill="#232f3e">Ubuntu, Gunicorn :8000, Django</text>
  <text x="420" y="457" text-anchor="middle" font-size="12" fill="#232f3e">WhiteNoise static files, systemd</text>
  <text x="420" y="471" text-anchor="middle" font-size="11" fill="#232f3e">SG: App-SG, no public IP</text>

  <rect x="640" y="399" width="200" height="78" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="740" y="421" text-anchor="middle" font-size="14" font-weight="bold" fill="#232f3e">Admin access</text>
  <text x="740" y="440" text-anchor="middle" font-size="12" fill="#232f3e">SSM Session Manager</text>
  <text x="740" y="457" text-anchor="middle" font-size="12" fill="#232f3e">IAM role on the instance</text>
  <text x="740" y="471" text-anchor="middle" font-size="11" fill="#232f3e">no SSH port open</text>

  <!-- ALB -> EC2 -->
  <line x1="420" y1="318" x2="420" y2="398" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432" y="355" font-size="12" fill="#232f3e">HTTP :8000</text>
  <text x="432" y="369" font-size="11" fill="#232f3e">(source: ALB-SG)</text>

  <!-- EC2 -> NAT outbound (dashed) -->
  <line x1="540" y1="410" x2="690" y2="320" stroke="#8a8f98" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="640" y="372" font-size="11" fill="#6b7280">outbound only: apt, pip,</text>
  <text x="640" y="386" font-size="11" fill="#6b7280">git, SSM</text>

  <!-- Tier 3 -->
  <rect x="60" y="520" width="840" height="125" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="74" y="539" font-size="13" font-weight="bold" fill="#e65100">TIER 3 - Database: private DB subnets (AZ-a and AZ-b)</text>

  <rect x="300" y="553" width="240" height="78" rx="8" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <text x="420" y="575" text-anchor="middle" font-size="14" font-weight="bold" fill="#232f3e">RDS MySQL: trackpoint-db</text>
  <text x="420" y="594" text-anchor="middle" font-size="12" fill="#232f3e">database: trackpoint, port 3306</text>
  <text x="420" y="611" text-anchor="middle" font-size="12" fill="#232f3e">single instance, public access: No</text>
  <text x="420" y="625" text-anchor="middle" font-size="11" fill="#232f3e">SG: DB-SG</text>

  <!-- EC2 -> RDS -->
  <line x1="420" y1="477" x2="420" y2="552" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432" y="505" font-size="12" fill="#232f3e">MySQL :3306</text>
  <text x="432" y="519" font-size="11" fill="#232f3e">(source: App-SG)</text>

  <!-- Legend -->
  <line x1="40" y1="708" x2="80" y2="708" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="712" font-size="12" fill="#232f3e">User / application traffic</text>
  <line x1="300" y1="708" x2="340" y2="708" stroke="#8a8f98" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="350" y="712" font-size="12" fill="#232f3e">Outbound-only traffic through the NAT Gateway</text>
  <text x="40" y="732" font-size="11" fill="#6b7280">Security groups are chained: ALB-SG (80 from internet) to App-SG (8000 from ALB-SG) to DB-SG (3306 from App-SG).</text>
</svg>
